<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" fill="none" role="img" aria-label="Via Sudeste Transportes S/A">
  <defs>
    <!-- Cores oficiais da Via Sudeste: verde vibrante #00C300 / #00B020 e verde escuro -->
    <style>
      .vs-green { fill: #00B517; }
      .vs-dark { fill: #0a4d1e; }
      .vs-text { font-family: 'Arial Black', Arial, Helvetica, sans-serif; font-weight: 900; }
      .vs-sub { font-family: Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- Símbolo estilizado 'VS' (duas faixas / faixas dinâmicas de transporte) -->
  <g class="vs-green">
    <!-- Faixa externa do V e curva superior direita do S -->
    <path d="M 4 14 L 38 78 L 47 78 L 19 24 L 32 24 L 54 66 L 68 38 C 73 28 81 22 93 20 C 103 18 112 21 118 27 L 111 34 C 107 29 101 27 94 28 C 85 29 80 34 76 42 L 58 78 L 33 78 L 0 14 Z" />
    
    <!-- Faixa interna do V e corpo do S dinâmico -->
    <path d="M 23 14 L 46 58 L 41 68 L 14 14 Z" />
    <path d="M 43 14 C 54 14 62 17 68 22 L 61 29 C 56 25 50 22 43 22 L 31 22 L 50 60 L 59 42 C 63 34 71 28 82 26 L 80 18 C 67 20 57 27 51 38 L 40 14 Z" />
  </g>

  <!-- Tipografia 'Via Sudeste' -->
  <text x="100" y="52" class="vs-green vs-text" font-size="44" letter-spacing="-0.5">Via Sudeste</text>
  <!-- Subtítulo 'Transportes S/A' -->
  <text x="142" y="74" class="vs-green vs-sub" font-size="14">Transportes S/A</text>
</svg>
